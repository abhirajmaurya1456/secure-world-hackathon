<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PhishGuard</title>

    <style>
        body {
            width: 380px;
            font-family: Arial, sans-serif;
            padding: 16px;
            margin: 0;
            background: #f8fafc;
            color: #1e293b;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .shield {
    width: 32px;
    height: 32px;
    object-fit: contain;
}

        h2 {
            margin: 0;
            font-size: 22px;
        }

        .url-box {
            background: white;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 12px;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: wait;
        }

        #status {
            font-size: 13px;
            margin: 12px 0;
        }

        .result-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #cbd5e1;
        }

        #verdict {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .safe {
            color: #15803d;
        }

        .suspicious {
            color: #c2410c;
        }

        .phishing {
            color: #dc2626;
        }

        .risk-score {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .probability {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 15px;
        }

        h4 {
            margin: 10px 0 8px;
        }

        #reasons {
            margin: 0;
            padding-left: 20px;
        }

        #reasons li {
            margin-bottom: 7px;
            font-size: 13px;
        }
    </style>
</head>

<body>

   <div class="header">
    <img src="icons/icon128.png" class="shield" alt="PhishGuard">
    <h2>PhishGuard</h2>
</div>

    <div class="url-box" id="url">
        Checking current page...
    </div>

    <button id="analyzeBtn">
        Analyze Current URL
    </button>

    <div id="status"></div>

    <div id="result" class="result-card" style="display: none;">

        <div id="verdict"></div>

        <div class="risk-score" id="riskScore"></div>

        <div class="probability" id="probability"></div>

        <h4>Why?</h4>

        <ul id="reasons"></ul>

    </div>

    <script src="popup.js"></script>

</body>
</html>
