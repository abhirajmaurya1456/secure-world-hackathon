<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <title>PhishGuard Warning</title>

    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family: Arial, sans-serif;

    background: #111827;
    color: #e5e7eb;
}

.warning-card {
    width: 620px;
    max-width: 90%;

    background: #1e293b;

    border-radius: 18px;

    padding: 36px;

    text-align: center;

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.45);

    border-top: 7px solid #dc2626;
}

.shield {
    font-size: 58px;
    margin-bottom: 12px;
}

.brand {
    font-size: 18px;
    font-weight: bold;
    color: #cbd5e1;

    margin-bottom: 8px;
}

h1 {
    margin: 0;

    font-size: 32px;

    color: #ff5c5c;
}

.subtitle {
    margin-top: 12px;

    font-size: 16px;

    color: #cbd5e1;

    line-height: 1.5;
}

.url-box {
    margin-top: 22px;

    padding: 14px;

    background: #0f172a;

    border: 1px solid #475569;

    border-radius: 9px;

    font-size: 13px;

    text-align: left;

    word-break: break-all;

    color: #fca5a5;
}

.risk {
    margin-top: 20px;

    font-size: 20px;

    font-weight: bold;

    color: #ff5c5c;
}

.reasons {
    margin-top: 20px;

    text-align: left;

    background: #3a2024;

    border: 1px solid #7f3035;

    border-radius: 10px;

    padding: 15px 20px;
}

.reasons h3 {
    margin-top: 0;

    color: #ff8a8a;
}

.reasons li {
    margin-bottom: 8px;

    font-size: 14px;

    line-height: 1.4;

    color: #d1d5db;
}

.buttons {
    display: flex;

    gap: 12px;

    margin-top: 28px;
}

button {
    flex: 1;

    padding: 13px;

    border: none;

    border-radius: 8px;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}

#backButton {
    background: #334155;
    color: #f8fafc;
}

#backButton:hover {
    background: #475569;
}

#continueButton {
    background: #1e293b;

    color: #ff6b6b;

    border: 1px solid #ef4444;
}

#continueButton:hover {
    background: #3a2024;
}

.note {
    margin-top: 18px;

    font-size: 12px;

    color: #94a3b8;
}
    </style>

</head>

<body>

    <div class="warning-card">

        <div class="shield">
            🛡️
        </div>

        <div class="brand">
            PhishGuard
        </div>

        <h1>
            ⚠️ PHISHING DETECTED
        </h1>

        <div class="subtitle">
            This URL has been identified as
            <strong>high risk</strong> based on
            URL analysis.
        </div>

        <div class="url-box" id="url">
            Analyzing URL...
        </div>

        <div class="risk" id="riskScore">
            Risk Score: --
        </div>

        <div class="reasons">

            <h3>
                Why was this blocked?
            </h3>

            <ul id="reasons">
            </ul>

        </div>

        <div class="buttons">

            <button id="backButton">
                ← Go Back
            </button>

            <button id="continueButton">
                Continue Anyway
            </button>

        </div>

        <div class="note">
            PhishGuard performs URL-level security analysis.
            No webpage content was accessed by the detector.
        </div>

    </div>


    <script src="warning.js"></script>

</body>
</html>
